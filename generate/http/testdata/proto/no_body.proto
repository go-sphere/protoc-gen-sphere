syntax = "proto3";

package testdata.nobody.v1;

import "google/api/annotations.proto";
import "sphere/binding/binding.proto";

option go_package = "github.com/go-sphere/protoc-gen-sphere/generate/http/testdata/gen/nobodyv1;nobodyv1";

// NoBodyService exercises no-body HTTP methods (GET/DELETE) that also declare a
// body. The body must be ignored: the generated handlers must not emit a
// ctx.BindJSON call, otherwise the endpoints are unusable.
service NoBodyService {
  // GetItem declares `body: "*"` on a GET, which is invalid. The generator must
  // drop the body and bind only the URI/query params.
  rpc GetItem(GetItemRequest) returns (GetItemResponse) {
    option (google.api.http) = {
      get: "/api/items/{id}"
      body: "*"
    };
  }

  // DeleteItem declares `body: "*"` on a DELETE. The body must be ignored too;
  // its fields are bound from the URI/query instead.
  rpc DeleteItem(DeleteItemRequest) returns (DeleteItemResponse) {
    option (google.api.http) = {
      delete: "/api/items/{id}"
      body: "*"
    };
  }
}

message GetItemRequest {
  int64 id = 1 [(sphere.binding.location) = BINDING_LOCATION_URI];
  string filter = 2 [(sphere.binding.location) = BINDING_LOCATION_QUERY];
}

message GetItemResponse {
  int64 id = 1;
  string name = 2;
}

message DeleteItemRequest {
  int64 id = 1 [(sphere.binding.location) = BINDING_LOCATION_URI];
  string reason = 2 [(sphere.binding.location) = BINDING_LOCATION_QUERY];
}

message DeleteItemResponse {
  bool ok = 1;
}
